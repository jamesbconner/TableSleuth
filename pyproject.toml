[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "table-sleuth"
version = "0.1.0"
description = "Table Sleuth - a Textual TUI for Open Table Format forensics (OTF) with data profiling."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Apache-2.0" }
authors = [
    { name = "James Conner", email = "jamesbconner@gmail.com" }
]
keywords = ["iceberg", "parquet", "duckdb", "tui", "textual", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Table format support - MVP: Iceberg
dependencies = [
    "pyiceberg[s3fs]>=0.9.1",
    "textual>=0.86.2",
    "pyarrow>=22.0.0",
    "pandas>=2.3.0",
    "adbc-driver-flightsql>=1.7.0",
    "click>=8.1.0",
    "pydantic>=2.11.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.10.0,<2.0.0",
    "textual-dev>=1.7.0,<2.0.0",
    "types-toml",
    "pre-commit>=4.0.0,<5.0.0",
    "bandit[toml]>=1.7.0,<2.0.0",
]

[project.scripts]
table-sleuth = "table_sleuth.cli:entry_point"

[project.urls]
Homepage = "https://github.com/jamesbconner/table-sleuth"
Repository = "https://github.com/jamesbconner/table-sleuth"

# Hatchling configuration for src layout
# Removed to let hatchling auto determine the package in src

# -----------------------
# Ruff configuration
# -----------------------
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E203",  # whitespace before :
  "E501",  # line length (handled by formatter / your judgment)
  "F401",  # unused imports (common in stubs/WIP)
  "F841",  # unused variables (common in stubs/WIP)
  "F811",  # redefinition of unused name
  "B008",  # function calls in argument defaults
  "UP007", # use X | Y for type annotations (prefer Optional for clarity)
  "UP035", # typing.Dict/List -> dict/list (allow both styles)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# -----------------------
# mypy configuration
# -----------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false

warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

ignore_missing_imports = true

# -----------------------
# pytest configuration
# -----------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

# Optional markers you might use later
markers = [
  "integration: marks tests as integration tests",
  "slow: marks tests as slow",
]

# Filter out third-party deprecation warnings from dependencies
# This error is being emitted from the pyiceberg 0.10.0 library
# TODO: Review this filter in the future when pyiceberg is upated
filterwarnings = [
  "ignore::pydantic.warnings.PydanticDeprecatedSince212",
]

# -----------------------
# bandit configuration
# -----------------------
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # Skip assert_used check (common in tests)
