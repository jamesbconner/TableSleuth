[tool.poetry]
name = "table-sleuth"
version = "0.1.0"
description = "Table Sleuth - a Textual TUI for open table format forensics (Iceberg MVP) with DuckDB-based profiling."
authors = ["James Conner <jamesbconner@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"

# src layout: package lives under src/table_sleuth
packages = [
  { include = "table_sleuth", from = "src" }
]

# If you plan to publish, set these later
homepage = "https://github.com/your-org/table-sleuth"
repository = "https://github.com/your-org/table-sleuth"
keywords = ["iceberg", "parquet", "duckdb", "tui", "textual", "data-engineering"]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"

# Table format support - MVP: Iceberg
pyiceberg = { version = ">=0.7.0,<1.0.0", extras = ["s3fs"] }

# TUI framework
textual = ">=0.70.0,<1.0.0"

# Data handling
pyarrow = ">=16.0.0,<19.0.0"
pandas = ">=2.2.0,<3.0.0"

# DuckDB profiling via GizmoSQL (Arrow Flight SQL)
adbc-driver-flightsql = ">=0.10.0,<1.0.0"

# CLI and configuration
click = ">=8.1.0,<9.0.0"
pydantic = ">=2.8.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.23.0,<1.0.0"
pytest-cov = ">=5.0.0,<6.0.0"
ruff = ">=0.7.0,<0.8.0"
mypy = ">=1.10.0,<2.0.0"
textual-dev = ">=1.7.0,<2.0.0"
types-toml = "*"

[tool.poetry.scripts]
table-sleuth = "table_sleuth.cli:entry_point"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# -----------------------
# Ruff configuration
# -----------------------
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E203",  # whitespace before :
  "E501",  # line length (handled by formatter / your judgment)
]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# -----------------------
# mypy configuration
# -----------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false

warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

ignore_missing_imports = true

# -----------------------
# pytest configuration
# -----------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

# Optional markers you might use later
markers = [
  "integration: marks tests as integration tests",
  "slow: marks tests as slow",
]
